name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    # 代码用到 ctypes.windll / pyautogui，必须跑在 Windows runner 上。
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # 必须检出到 auto_game_unified 子目录：测试和源码都用
      # `import auto_game_unified.xxx`，只有包目录真的叫这个名字才能导入。
      - uses: actions/checkout@v4
        with:
          path: auto_game_unified

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: auto_game_unified/requirements-dev.txt

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r auto_game_unified/requirements-dev.txt

      # 静态检查放在测试**之前**：几秒钟就能跑完，让「未使用 import / 未定义名字 /
      # 类型与标注冲突」这类问题在最早的位置暴露，不必等十分钟的全量测试。
      # 规则与范围（含 mypy 为什么只覆盖 core/）见 auto_game_unified/pyproject.toml。
      - name: Lint (ruff)
        working-directory: ${{ github.workspace }}
        run: python -m ruff check auto_game_unified

      - name: Type check (mypy)
        working-directory: ${{ github.workspace }}
        run: python -m mypy --config-file auto_game_unified/pyproject.toml

      - name: Compile
        working-directory: ${{ github.workspace }}
        run: python -m compileall -q auto_game_unified

      # 治理门禁单独成一步：本机可以用 --no-verify 跳钩子，但这一步在干净检出上跑，
      # 跳不过去。失败时一眼就能看出是「文档治理」而不是「业务测试」坏了。
      # 这里同时就是「干净检出一致性」检查：本机被 .gitignore 忽略的临时文件不在场。
      - name: Governance gate (docs / status / handover)
        working-directory: ${{ github.workspace }}
        run: |
          python -m pytest -q auto_game_unified/tests/test_status_doc.py auto_game_unified/tests/test_docs_index.py auto_game_unified/tests/test_doc_review.py auto_game_unified/tests/test_new_decision.py auto_game_unified/tests/test_governance_selfcheck.py

      - name: Run test suite
        working-directory: ${{ github.workspace }}
        run: python -m pytest -q auto_game_unified/tests
