name: tests

# PR 在合并结果上按影响选测。标签、手动和每周任务始终全量。
# ⚠️ job 名 `pytest` 不能改 —— main 的分支保护认这个检查项。
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    # 代码用到 ctypes.windll / pyautogui，必须跑在 Windows runner 上。
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # 必须检出到 auto_game_unified 子目录：测试和源码都用
      # `import auto_game_unified.xxx`，只有包目录真的叫这个名字才能导入。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: auto_game_unified
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: auto_game_unified/requirements-dev.txt

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r auto_game_unified/requirements-dev.txt

      # 静态检查放在测试**之前**：几秒钟就能跑完，让「未使用 import / 未定义名字 /
      # 类型与标注冲突」这类问题在最早的位置暴露，不必等十分钟的全量测试。
      # 规则与范围（含 mypy 为什么只覆盖 core/）见 auto_game_unified/pyproject.toml。
      - name: Lint (ruff)
        working-directory: ${{ github.workspace }}
        run: python -m ruff check auto_game_unified

      - name: Type check (mypy)
        working-directory: ${{ github.workspace }}
        run: python -m mypy --config-file auto_game_unified/pyproject.toml

      - name: Compile
        working-directory: ${{ github.workspace }}
        run: python -m compileall -q auto_game_unified

      # 治理门禁单独成一步：本机可以用 --no-verify 跳钩子，但这一步在干净检出上跑，
      # 跳不过去。失败时一眼就能看出是「文档治理」而不是「业务测试」坏了。
      # 这里同时就是「干净检出一致性」检查：本机被 .gitignore 忽略的临时文件不在场。
      - name: Governance gate (docs / isolation / packaging)
        working-directory: ${{ github.workspace }}
        run: |
          python -m pytest -q auto_game_unified/tests/test_status_doc.py auto_game_unified/tests/test_docs_index.py auto_game_unified/tests/test_doc_review.py auto_game_unified/tests/test_new_decision.py auto_game_unified/tests/test_governance_selfcheck.py auto_game_unified/tests/test_core_dependencies.py auto_game_unified/tests/test_route_acceptance.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q auto_game_unified/tests/test_check_gate.py auto_game_unified/tests/test_hero_roster_check.py

      # HEAD^1 是 GitHub 合并检出中目标分支的提交；一次比较覆盖整个 PR。
      - name: Run PR regression
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        run: python -m auto_game_unified.tools.pr_tests --base 'HEAD^1'

      - name: Run test suite (full)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        working-directory: ${{ github.workspace }}
        run: python -m pytest -q --durations=10 auto_game_unified/tests
