name: Bug 报告（认不出 / 点错 / 卡住 / 崩溃）
description: 某条路线在真实游戏画面上没跑通，或者桌面界面出问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        提交前请先看一遍 [故障排查](https://github.com/Kangkangnice/epic7-automation/blob/main/docs/TROUBLESHOOTING.md)。
        涉及越权执行、误消耗资源或隐私泄露时，请按 [安全政策](https://github.com/Kangkangnice/epic7-automation/blob/main/SECURITY.md) 报告。
        本表单公开可见。请只提交脱敏的最小复现材料，完整诊断包留在本机。

  - type: input
    id: route
    attributes:
      label: 出问题的路线
      description: |
        填写[现状速查](https://github.com/Kangkangnice/epic7-automation/blob/main/docs/STATUS.md)里的路线名称或标识。
        桌面界面或独立工具的问题可以直接填对应页面名称。
      placeholder: 迷宫强化石（labyrinth_stone）
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 助手版本或提交号
      description: 打包版填写「关于」显示的版本。源码运行请填写 git rev-parse --short HEAD 的输出。
      placeholder: v0.1.0 或 9308cdf
    validations:
      required: true

  - type: dropdown
    id: how
    attributes:
      label: 怎么启动的
      options:
        - 桌面助手（勾选路线后点开始任务）
        - 命令行干跑
        - 命令行实跑
        - 其它
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: 游戏客户端
      options:
        - 雷电模拟器
        - PC 客户端
        - 不涉及游戏客户端
        - 不确定
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: 运行环境
      description: 填写 Windows 版本、客户端版本、渲染区分辨率和缩放比例。源码运行请加上 Python 版本。
      placeholder: Windows 11，PC 客户端，1920x1080，缩放 100%，Python 3.11
    validations:
      required: true

  - type: dropdown
    id: exit-code
    attributes:
      label: 退出码（界面底部或日志末尾会写）
      options:
        - "0：完成目标次数"
        - "1：运行故障 / 认不出页面 / 超时"
        - "2：资源耗尽停止"
        - "130：我手动停止的"
        - 没有退出码或不确定
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从哪一屏开始、勾了哪几条、填了几次
      placeholder: |
        1. 游戏停在大厅
        2. 只勾「迷宫强化石」，次数默认
        3. 点开始任务，约 40 秒后停下
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望发生什么 / 实际发生了什么
      placeholder: |
        期望：买完强化石后自己回大厅
        实际：停在商店页，日志写「连按 2 次 ESC 页面都没有变化」
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 关键日志
      description: |
        如果有日志，请粘贴故障附近的约 20～30 行（`runtime_logs/epic7_<路线>.log`）。
        提交前请移除账号信息、令牌、环境变量值和本机绝对路径。
      render: text

  - type: checkboxes
    id: selfcheck
    attributes:
      label: 提交前自检
      options:
        - label: 我已查看故障排查文档，并检查了提交内容中的个人信息和凭据
          required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 可附一张保留关键画面且已遮盖个人信息的截图，并说明游戏是否刚更新。
